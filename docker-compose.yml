services:

  postgres:
    image: postgres:16-alpine
    container_name: hll-bot-db
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build: ./collector
    container_name: hll-collector
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CRCON_URL: ${CRCON_URL}              # 8010 con auth (necesario para get_historical_logs)
      CRCON_API_KEY: ${CRCON_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      COLLECT_INTERVAL_MINUTES: ${COLLECT_INTERVAL_MINUTES:-30}
      BACKFILL_KILL_EVENTS: ${BACKFILL_KILL_EVENTS:-false}
      BACKFILL_MATCH_STATS: ${BACKFILL_MATCH_STATS:-false}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}

  bot:
    build: ./bot
    container_name: hll-bot
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      CRCON_URL: ${CRCON_URL}              # 8010 con auth
      CRCON_API_KEY: ${CRCON_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}

volumes:
  postgres_data: